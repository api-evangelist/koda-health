aid: koda-health
name: Koda Health
description: Koda Health is a Houston-based digital health company whose AI-enhanced patient decision
  support platform digitizes serious illness planning for health systems, health plans, and value-based
  care organizations. Its two solutions — Advance Care Planning (ACP) and Kidney Action Planning (KAP)
  for chronic kidney disease — walk patients through video-guided, interactive goals-of-care conversations
  and produce legally compliant advance directives, medical power of attorney, and POLST/DNR documents
  with digital signing and notarization across all 50 states. Completed plans are pushed into the
  provider's EMR through an integration Koda states meets HL7 FHIR standards, and can be shared with
  care teams, payors, and family. KodaCares adds human Patient Advocates for complex cases. Koda publishes
  no public developer portal, API documentation, or SDKs; its API host (api.kodahealthcare.com) is a
  closed backend serving the app, and EMR interoperability is delivered through partner and health-system
  integrations rather than a self-serve public API.
